<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9e1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amigo Secreto">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Amigo Secreto de Natal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600;1,9..144,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: etiquetas de presente em grade; tocar abre a ficha da pessoa com o que ela quer ganhar */
:root{
  --bg:#fbf6f0; --paper:#ffffff; --ink:#2a1b1b; --muted:#6e5c58; --line:#ead9cf;
  --pine:#1d5a3a; --pine-ink:#ffffff; --berry:#b3202f; --tag:#f6e8dc; --ok:#1d7a47;
  --band:#9e1b2a; --band-ink:#fff6ea; --filled:#1f6e43; --ribbon:#d0202f; --gold:#c9972b; --snow:rgba(255,255,255,.85);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a14; --paper:#16241c; --ink:#f3ece4; --muted:#b4a89f; --line:#2b3d32;
  --pine:#6cc995; --pine-ink:#0d1a12; --berry:#f07a84; --tag:#1d3026; --ok:#7fdca5;
  --band:#6e1220; --band-ink:#fff3e2; --filled:#1d7445; --ribbon:#e0323f; --gold:#e3b54f; --snow:rgba(255,255,255,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a14; --paper:#16241c; --ink:#f3ece4; --muted:#b4a89f; --line:#2b3d32;
  --pine:#6cc995; --pine-ink:#0d1a12; --berry:#f07a84; --tag:#1d3026; --ok:#7fdca5;
  --band:#6e1220; --band-ink:#fff3e2; --filled:#1d7445; --ribbon:#e0323f; --gold:#e3b54f; --snow:rgba(255,255,255,.7); color-scheme:dark}
*{box-sizing:border-box}
.hero{position:relative;overflow:hidden;background:var(--band);color:var(--band-ink);
  background-image:radial-gradient(circle at 15% 120%,rgba(255,255,255,.08) 0 40%,transparent 41%),radial-gradient(circle at 90% -30%,rgba(255,255,255,.07) 0 35%,transparent 36%)}
.hero-in{max-width:880px;margin:0 auto;padding-block:40px 34px;position:relative;z-index:1;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.hero .eyebrow{color:var(--gold)}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero .lead{color:var(--band-ink);opacity:.88}
.garland{height:14px;background:repeating-linear-gradient(90deg,var(--pine) 0 22px,var(--gold) 22px 26px);
  -webkit-mask:radial-gradient(circle 9px at 13px -2px,#000 98%,transparent) 0 0/26px 14px repeat-x;mask:radial-gradient(circle 9px at 13px -2px,#000 98%,transparent) 0 0/26px 14px repeat-x}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tagbtn{border-top:3px solid var(--berry)}
.tagbtn::after{content:"";position:absolute;right:12px;top:-3px;width:14px;height:20px;background:var(--gold);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.sheet{border-top:4px solid var(--berry)}
.tagbtn.filled{background:var(--filled);border-color:var(--filled);color:#fff}
.tagbtn.filled:hover{border-color:var(--filled);filter:brightness(1.08)}
.tagbtn.filled .st,.tagbtn.filled .st.on{color:#fff;opacity:.92}
.tagbtn.filled::after{background:var(--ribbon)}
.tagbtn.filled::before{background:#fff;border-color:#fff}
.foot{text-align:center;color:var(--muted);font-size:13px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--berry);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,46px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0;max-width:60ch}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted);background:var(--tag);padding:10px 14px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.tagbtn{position:relative;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:6px 14px 14px 6px;padding:16px 14px 14px 30px;
  display:flex;flex-direction:column;gap:4px;min-height:88px;transition:transform .15s,border-color .15s}
.tagbtn::before{content:"";position:absolute;left:11px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;
  border:2px solid var(--line);background:var(--bg)}
.tagbtn:hover{transform:translateY(-2px);border-color:var(--pine)}
.tagbtn:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.tagbtn .nm{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.15}
.st{font-size:13px;color:var(--muted)}
.st.on{color:var(--ok);font-weight:600}
.tagbtn.filled::before{background:var(--ok);border-color:var(--ok)}
/* ficha */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sheet h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);margin:0;line-height:1.05}
.back{font:inherit;font-size:14px;background:none;border:0;color:var(--pine);cursor:pointer;padding:0;font-weight:600;align-self:flex-start}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--pine);background:var(--pine);color:var(--pine-ink)}
.btn.ghost{background:transparent;color:var(--pine)}
.btn:focus-visible,.back:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.val{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.val a{color:var(--pine)}
.empty{color:var(--muted);font-style:italic}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
form{display:flex;flex-direction:column;gap:14px}
form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
form textarea,form input{font:inherit;font-weight:400;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
form textarea{min-height:96px;resize:vertical}
.hint{font-weight:400;color:var(--muted);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-size:14px;color:var(--muted)}
.msg.err{color:var(--berry)}
.upd{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.tagbtn{transition:none}.tagbtn:hover{transform:none}}
/* ===== Modo app (celular) ===== */
.appbar{display:none}
html{-webkit-tap-highlight-color:transparent}
@media (max-width:640px){
  body{overscroll-behavior-y:none}
  button,.tagbtn{-webkit-user-select:none;user-select:none}
  .hero-in{padding-block:calc(18px + env(safe-area-inset-top,0px)) 18px;gap:4px}
  .hero h1{font-size:30px}
  .hero .lead{font-size:15px}
  .wrap{padding-block:14px calc(32px + env(safe-area-inset-bottom,0px));gap:14px}
  #list .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;margin-top:-10px}
  #list .bar input{font-size:16px;padding:13px 14px;border-radius:14px}
  .count{width:100%;font-size:13px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px!important}
  .tagbtn{aspect-ratio:1/0.72;min-height:0;flex-direction:column;align-items:flex-start;justify-content:space-between;
    padding:22px 14px 14px;border-radius:18px;border-top-width:1px}
  .tagbtn::after{right:14px;left:auto;top:-1px;width:12px;height:17px}
  .tagbtn::before{display:none}
  .tagbtn .nm{font-size:20px;line-height:1.15;overflow-wrap:anywhere}
  .tagbtn .st{font-size:12.5px;line-height:1.3;padding-right:18px}
  .tagbtn > .chev{position:absolute;right:12px;bottom:11px;font-size:20px;line-height:1;opacity:.55}
  .tagbtn:hover{transform:none}
  .tagbtn:active{transform:scale(.98);filter:brightness(.97)}
  body.in-detail .hero, body.in-detail .garland, body.in-detail .foot{display:none}
  body.in-detail .appbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:6px;
    background:var(--band);color:var(--band-ink);min-height:56px;
    padding-top:env(safe-area-inset-top,0px);
    padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .appbar button{font:inherit;font-size:28px;line-height:1;background:none;border:0;color:inherit;width:44px;height:44px;border-radius:22px;cursor:pointer}
  .appbar button:active{background:rgba(255,255,255,.15)}
  .appbar span{font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.in-detail .sheet{border-radius:16px;padding:18px;gap:16px}
  body.in-detail .sheet .back,body.in-detail .sheet .sheet-top{display:none}
  .sheet .val{font-size:17px;line-height:1.6}
}
.gifts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.gifts li{display:flex;gap:10px;align-items:flex-start;background:var(--tag);border-radius:12px;padding:12px 14px;font-size:17px;overflow-wrap:anywhere}
.gifts li::before{content:"🎁";flex:none}
</style>
<style>body{margin:0;font-size:16px}[hidden]{display:none!important}</style>
</head>
<body>
<div class="appbar" aria-hidden="true"><button type="button" id="ab-back" aria-label="Voltar">‹</button><span id="ab-title"></span></div>
<header class="hero">
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="hero-in">
    <span class="eyebrow">Natal 2026 · 15 participantes</span>
    <h1>Amigo Secreto <em>de Natal</em></h1>
    <p class="lead">Quem você tirou? Toque no nome da pessoa para ver os presentes que ela gostaria de ganhar.</p>
  </div>
</header>
<div class="garland" aria-hidden="true"></div>

<div class="wrap">

  
  <section id="list" aria-label="Participantes">
    <div class="bar">
      <input id="q" type="search" placeholder="Digite o nome de quem você tirou…" aria-label="Buscar nome" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
    <ul class="grid" id="grid" style="margin-top:14px"></ul>
  </section>

  <section id="detail" class="sheet" hidden aria-live="polite"></section>
  <p class="foot">Boas festas! Guarde segredo de quem você tirou.<br><a href="admin.html" style="color:var(--muted)">Área restrita</a><br><span style="font-size:12px;opacity:.7">Versão 1.6 · 09/11 17:25</span></p>
</div>
<script>
const $=id=>document.getElementById(id);
let PRESENTES={},NAMES=[];
let current=null;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function filled(d){return d && String(d.quero||"").trim().length>0}
function renderGrid(){
  const q=$("q").value.trim().toLowerCase();const g=$("grid");g.innerHTML="";let n=0;
  NAMES.forEach(name=>{const d=PRESENTES[name];if(filled(d))n++;
    if(q&&!name.toLowerCase().includes(q))return;
    const li=document.createElement("li"),b=document.createElement("button");
    b.type="button";b.className="tagbtn"+(filled(d)?" filled":"");
    b.innerHTML=`<span class="nm">${esc(name)}</span><span class="st ${filled(d)?"on":""}">${filled(d)?"Ver presentes":"Ainda sem presentes"}</span>`;
    b.insertAdjacentHTML("beforeend",'<span class="chev" aria-hidden="true">›</span>');b.onclick=()=>open(name);li.appendChild(b);g.appendChild(li)});
  $("count").textContent=`${n} de ${NAMES.length} já preencheram`;
}
function show(name){current=name;document.body.classList.add("in-detail");$("ab-title").textContent=name;$("list").hidden=true;$("detail").hidden=false;renderDetail();scrollTo(0,0)}
function open(name){show(name);history.pushState({p:name},"","#"+encodeURIComponent(name))}
function hide(){current=null;document.body.classList.remove("in-detail");$("detail").hidden=true;$("list").hidden=false;renderGrid()}
function close(){if(history.state&&history.state.p)history.back();else{hide();history.replaceState(null,"",location.pathname)}}
addEventListener("popstate",()=>{const h=decodeURIComponent(location.hash.slice(1));if(h&&PRESENTES[h])show(h);else hide()});
function renderDetail(){
  const d=PRESENTES[current]||{};
  const row=(lbl,v,html)=>`<div class="field"><span class="lbl">${lbl}</span>${v&&String(v).trim()?`<p class="val">${html?linkify(v):esc(v)}</p>`:`<p class="val empty">—</p>`}</div>`;
  $("detail").innerHTML=`<button class="back" type="button" id="back">← Voltar para a lista</button>
    <div class="sheet-top"><div><span class="lbl">Presentes para</span><h2>${esc(current)}</h2></div></div>
    ${filled(d)?`<div class="field"><span class="lbl">Escolha um destes presentes</span><ul class="gifts">${String(d.quero).split(/\n+/).filter(t=>t.trim()).map(t=>`<li><span>${linkify(t.trim())}</span></li>`).join("")}</ul></div>
      ${[d.tamanhos&&String(d.tamanhos).trim()?row("Tamanhos",d.tamanhos):"",d.gostos&&String(d.gostos).trim()?row("Cores ou gostos",d.gostos):""].filter(Boolean).length?`<div class="two">${d.tamanhos&&String(d.tamanhos).trim()?row("Tamanhos",d.tamanhos):""}${d.gostos&&String(d.gostos).trim()?row("Cores ou gostos",d.gostos):""}</div>`:""}`
    :`<p class="empty" style="margin:0">Os presentes de ${esc(current)} ainda não foram cadastrados. Volte mais tarde.</p>`}`;
  $("back").onclick=close;
}
$("q").addEventListener("input",renderGrid);
$("ab-back").onclick=close;
(function snow(){
  const c=$("snow"); if(!c||!c.getContext) return;
  const x=c.getContext("2d"); let w,h,flakes=[];
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;w=r.width;h=r.height;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
    flakes=Array.from({length:Math.round(w/14)},()=>({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*2.4,s:.3+Math.random()*.8,d:Math.random()*6}))}
  function draw(){x.clearRect(0,0,w,h);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--snow")||"#fff";
    flakes.forEach(f=>{x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill();if(!still){f.y+=f.s;f.x+=Math.sin((f.y+f.d*40)/40)*.3;if(f.y>h+4){f.y=-4;f.x=Math.random()*w}}});
    if(!still) requestAnimationFrame(draw)}
  size();addEventListener("resize",size);draw();
})();
$("count").textContent="Carregando…";
fetch("presentes.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{PRESENTES=d;NAMES=Object.keys(d);renderGrid();
  const h=decodeURIComponent(location.hash.slice(1));if(h&&PRESENTES[h])show(h);
}).catch(()=>{$("count").textContent="Não foi possível carregar a lista. Atualize a página."});
</script>
</body>
</html>
